<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Punch Clock – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
  <strong>Punch Clock admin</strong>
  <button id="logoutBtn" class="btn-small hidden">Log out</button>
</header>

<main>
  <section id="loginView" class="wrap hidden">
    <div class="panel">
      <h2>Admin log in</h2>
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <button id="loginBtn" class="btn-main">Log in</button>
      <p class="msg" id="loginMsg"></p>
    </div>
  </section>

  <section id="dashView" class="wrap-wide hidden">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabAtt" aria-selected="true">Attendance</button>
      <button role="tab" id="tabUsers" aria-selected="false">Employees</button>
    </div>

    <!-- Attendance -->
    <div id="attPane">
      <div class="filters">
        <div><label for="from">From</label><input id="from" type="date"></div>
        <div><label for="to">To</label><input id="to" type="date"></div>
        <div><label for="who">Employee</label><select id="who"><option value="">Everyone</option></select></div>
      </div>
      <div class="actions">
        <button id="loadBtn">Show attendance</button>
        <button id="xlsBtn" class="alt" disabled>Download Excel</button>
      </div>
      <p class="msg" id="attMsg"></p>

      <h3>Daily summary</h3>
      <p class="count" id="sumCount"></p>
      <div class="table-scroll"><table id="sumTable"></table></div>

      <h3>All punches</h3>
      <p class="count" id="rawCount"></p>
      <div class="table-scroll"><table id="rawTable"></table></div>
    </div>

    <!-- Users -->
    <div id="usersPane" class="hidden">
      <div class="filters"><div><label for="search">Search by name, mobile or email</label><input id="search"></div></div>
      <p class="count" id="userCount"></p>
      <div class="table-scroll"><table id="userTable"></table></div>
      <p class="msg" id="userMsg"></p>
    </div>
  </section>
</main>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL, FB } from "./firebase-config.js";
const { initializeApp } = await import(`${FB}/firebase-app.js`);
const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = await import(`${FB}/firebase-auth.js`);
const { getFirestore, collection, getDocs, query, where, doc, updateDoc } = await import(`${FB}/firebase-firestore.js`);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const setMsg = (el, t, type = "err") => { $(el).textContent = t; $(el).className = "msg " + type; };

let users = [];
let summaryRows = [], rawRows = [];

const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtT = d => d ? d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
const hrs = ms => { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };

// ---------- Auth ----------
onAuthStateChanged(auth, async user => {
  $("logoutBtn").classList.toggle("hidden", !user);
  if (!user) { $("dashView").classList.add("hidden"); $("loginView").classList.remove("hidden"); return; }
  if (user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    await signOut(auth); return setMsg("loginMsg", "This account is not the admin account.");
  }
  $("loginView").classList.add("hidden"); $("dashView").classList.remove("hidden");
  const t = dkey(new Date()); $("from").value = t; $("to").value = t;
  await loadUsers();
  loadAttendance();
});
$("loginBtn").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); setMsg("loginMsg", ""); }
  catch (e) { setMsg("loginMsg", "Wrong email or password."); }
};
$("logoutBtn").onclick = () => signOut(auth);

// ---------- Tabs ----------
function tab(which) {
  $("tabAtt").setAttribute("aria-selected", which === "att");
  $("tabUsers").setAttribute("aria-selected", which === "users");
  $("attPane").classList.toggle("hidden", which !== "att");
  $("usersPane").classList.toggle("hidden", which !== "users");
}
$("tabAtt").onclick = () => tab("att");
$("tabUsers").onclick = () => tab("users");

// ---------- Employees ----------
async function loadUsers() {
  const snap = await getDocs(collection(db, "users"));
  users = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
  $("who").innerHTML = `<option value="">Everyone</option>` +
    users.map(u => `<option value="${u.uid}">${esc(u.name)} (${esc(u.mobile)})</option>`).join("");
  renderUsers();
}
function renderUsers() {
  const s = $("search").value.trim().toLowerCase();
  const list = users.filter(u => !s || [u.name, u.mobile, u.email].some(v => String(v).toLowerCase().includes(s)));
  $("userCount").textContent = `${list.length} of ${users.length} employees · ${users.filter(u => u.blocked).length} blocked`;
  $("userTable").innerHTML = `<tr><th>Name</th><th>Mobile</th><th>Email</th><th>Joined</th><th>Status</th><th></th></tr>` +
    (list.map(u => `<tr>
      <td>${esc(u.name)}</td><td>${esc(u.mobile)}</td><td>${esc(u.email)}</td>
      <td>${u.createdAt ? u.createdAt.toDate().toLocaleDateString("en-IN") : ""}</td>
      <td><span class="pill ${u.blocked ? "blocked" : "active"}">${u.blocked ? "Blocked" : "Active"}</span></td>
      <td><button class="btn-small ${u.blocked ? "btn-unblock" : "btn-block"}" data-uid="${u.uid}">${u.blocked ? "Unblock" : "Block"}</button></td>
    </tr>`).join("") || `<tr><td colspan="6">No employees match your search.</td></tr>`);
}
$("search").oninput = renderUsers;
$("userTable").onclick = async e => {
  const uid = e.target.dataset?.uid; if (!uid) return;
  const u = users.find(x => x.uid === uid);
  const action = u.blocked ? "Unblock" : "Block";
  if (!confirm(`${action} ${u.name}?`)) return;
  try {
    await updateDoc(doc(db, "users", uid), { blocked: !u.blocked });
    u.blocked = !u.blocked; renderUsers();
    setMsg("userMsg", `${u.name} ${u.blocked ? "blocked" : "unblocked"}.`, "ok");
  } catch (err) { setMsg("userMsg", "Could not update. Check that firestore.rules has your admin email."); }
};

// ---------- Attendance ----------
async function loadAttendance() {
  const from = $("from").value, to = $("to").value, who = $("who").value;
  if (!from || !to || from > to) return setMsg("attMsg", "Pick a valid date range.");
  setMsg("attMsg", "Loading…", "ok"); $("xlsBtn").disabled = true;
  try {
    const q = query(collection(db, "punches"), where("date", ">=", from), where("date", "<=", to));
    let rows = (await getDocs(q)).docs.map(d => d.data()).filter(r => r.time);
    if (who) rows = rows.filter(r => r.uid === who);
    rows.sort((a, b) => a.time.toMillis() - b.time.toMillis());

    // Raw punches
    rawRows = rows.map(r => {
      const t = r.time.toDate();
      return {
        Name: r.name, Mobile: r.mobile, Email: r.email, Date: r.date, Type: r.type === "IN" ? "Punch in" : "Punch out",
        Time: fmtT(t), Location: r.lat != null ? `https://maps.google.com/?q=${r.lat},${r.lng}` : "Not shared",
        "Accuracy (m)": r.accuracy ?? ""
      };
    });

    // Daily summary per employee per day
    const groups = {};
    rows.forEach(r => (groups[`${r.uid}|${r.date}`] ??= []).push(r));
    summaryRows = Object.values(groups).map(list => {
      let total = 0, start = null;
      for (const r of list) {
        if (r.type === "IN") start = r.time.toMillis();
        else if (r.type === "OUT" && start) { total += r.time.toMillis() - start; start = null; }
      }
      const ins = list.filter(r => r.type === "IN"), outs = list.filter(r => r.type === "OUT");
      const f = list[0];
      return {
        Name: f.name, Mobile: f.mobile, Date: f.date,
        "First in": ins[0] ? fmtT(ins[0].time.toDate()) : "",
        "Last out": outs.at(-1) ? fmtT(outs.at(-1).time.toDate()) : "",
        "Hours worked": hrs(total),
        Status: list.at(-1).type === "IN" ? "Still punched in" : "Done"
      };
    }).sort((a, b) => a.Date.localeCompare(b.Date) || a.Name.localeCompare(b.Name));

    drawTable("sumTable", summaryRows, "No attendance in this range.");
    drawTable("rawTable", rawRows, "No punches in this range.", true);
    $("sumCount").textContent = `${summaryRows.length} employee-days`;
    $("rawCount").textContent = `${rawRows.length} punches`;
    $("xlsBtn").disabled = !rawRows.length;
    setMsg("attMsg", "");
  } catch (e) { setMsg("attMsg", "Could not load: " + e.message); }
}
function drawTable(id, rows, empty, linkLoc = false) {
  if (!rows.length) return $(id).innerHTML = `<tr><td>${empty}</td></tr>`;
  const cols = Object.keys(rows[0]);
  $(id).innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>` + rows.map(r => `<tr>${cols.map(c => {
    const v = r[c];
    if (linkLoc && c === "Location" && String(v).startsWith("http")) return `<td><a href="${esc(v)}" target="_blank" rel="noopener">Open map</a></td>`;
    return `<td>${esc(v)}</td>`;
  }).join("")}</tr>`).join("");
}
$("loadBtn").onclick = loadAttendance;

// ---------- Excel export ----------
$("xlsBtn").onclick = () => {
  const wb = XLSX.utils.book_new();
  const s1 = XLSX.utils.json_to_sheet(summaryRows), s2 = XLSX.utils.json_to_sheet(rawRows);
  s1["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 13 }, { wch: 16 }];
  s2["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 26 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 45 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, s1, "Summary");
  XLSX.utils.book_append_sheet(wb, s2, "All punches");
  XLSX.writeFile(wb, `attendance_${$("from").value}_to_${$("to").value}.xlsx`);
};

// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyB-OQHTi8WGp3r6-fDWbSjZTr8knchgbCQ",
  authDomain: "punch-clock-nbtizd.firebaseapp.com",
  projectId: "punch-clock-nbtizd",
  storageBucket: "punch-clock-nbtizd.firebasestorage.app",
  messagingSenderId: "1043468222187",
  appId: "1:1043468222187:web:946cb40d503e24fe4f08ae"
};

</script>
</body>
</html>
