<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<title>Punch Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <strong>Punch Clock</strong>
  <button id="logoutBtn" class="btn-small hidden">Log out</button>
</header>

<main class="wrap">
  <div id="installBar" class="install hidden">
    <span>Add this app to your home screen</span>
    <button id="installBtn" class="btn-small">Install</button>
  </div>

  <!-- Login -->
  <section id="loginView" class="panel hidden">
    <h2>Log in</h2>
    <label for="loginId">Mobile number or email</label>
    <input id="loginId" autocomplete="username" placeholder="9876543210 or you@company.com">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn-main">Log in</button>
    <button id="forgotBtn" class="btn-link">Forgot password</button>
    <p class="msg" id="loginMsg"></p>
    <p>New here? <button id="toSignup" class="btn-link">Create an account</button></p>
  </section>

  <!-- Sign up -->
  <section id="signupView" class="panel hidden">
    <h2>Create account</h2>
    <label for="suName">Full name</label>
    <input id="suName" autocomplete="name">
    <label for="suMobile">Mobile number</label>
    <input id="suMobile" inputmode="numeric" maxlength="10" placeholder="10 digits">
    <label for="suEmail">Email</label>
    <input id="suEmail" type="email" autocomplete="email">
    <label for="suPass">Password (min 6 characters)</label>
    <input id="suPass" type="password" autocomplete="new-password">
    <button id="signupBtn" class="btn-main">Create account</button>
    <p class="msg" id="signupMsg"></p>
    <p>Already registered? <button id="toLogin" class="btn-link">Log in</button></p>
  </section>

  <!-- Punch -->
  <section id="punchView" class="hidden">
    <p id="hello" style="text-align:center;margin:0"></p>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="today"></div>
    <button id="punchBtn" class="punch in">Punch in<small>tap to record</small></button>
    <p class="status" id="status"></p>
    <p class="msg" id="punchMsg" style="text-align:center"></p>
    <div class="panel">
      <h3 style="margin-top:0">Today</h3>
      <ul class="log" id="log"><li>No punches yet today.</li></ul>
    </div>
  </section>

  <!-- Blocked -->
  <section id="blockedView" class="panel blocked-box hidden">
    <h2>Account blocked</h2>
    <p>Your account has been blocked by the admin. Contact your manager to get access back.</p>
  </section>
</main>

<script type="module">
import { firebaseConfig, FB } from "./firebase-config.js";
const { initializeApp } = await import(`${FB}/firebase-app.js`);
const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
        signOut, sendPasswordResetEmail } = await import(`${FB}/firebase-auth.js`);
const { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, getDocs,
        serverTimestamp } = await import(`${FB}/firebase-firestore-lite.js`);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app); // lite = plain web requests, no "offline" mode
const $ = id => document.getElementById(id);
const views = ["loginView", "signupView", "punchView", "blockedView"];
const show = v => views.forEach(x => $(x).classList.toggle("hidden", x !== v));
const setMsg = (el, text, type = "err") => { $(el).textContent = text; $(el).className = "msg " + type; };

let profile = null;
let nextType = "IN";

// ---------- Helpers ----------
const todayKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtTime = d => d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
const friendly = e => ({
  "auth/invalid-credential": "Wrong mobile/email or password.",
  "auth/wrong-password": "Wrong password.",
  "auth/user-not-found": "No account found.",
  "auth/email-already-in-use": "This email is already registered. Log in instead.",
  "auth/weak-password": "Password must be at least 6 characters.",
  "auth/invalid-email": "That email address is not valid.",
  "auth/network-request-failed": "No internet connection. Try again.",
  "permission-denied": "Not allowed. Your account may be blocked.",
  "unavailable": "Can't reach the server. Check your internet, or ask the admin to check the Firestore database is created."
}[e.code] || e.message);

function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });
}

// ---------- Clock ----------
setInterval(() => {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  $("today").textContent = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}, 1000);

// ---------- Auth state ----------
onAuthStateChanged(auth, async user => {
  $("logoutBtn").classList.toggle("hidden", !user);
  if (!user) { profile = null; return show("loginView"); }
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) return show("signupView");   // account half-created; finish signup
    profile = snap.data();
    if (profile.blocked) return show("blockedView");
    $("hello").textContent = `Hi, ${profile.name}`;
    show("punchView");
    loadToday();
  } catch (e) { show("loginView"); setMsg("loginMsg", friendly(e)); }
});

// ---------- Login (mobile or email) ----------
$("loginBtn").onclick = async () => {
  const id = $("loginId").value.trim(), pass = $("loginPass").value;
  if (!id || !pass) return setMsg("loginMsg", "Enter your mobile/email and password.");
  $("loginBtn").disabled = true; setMsg("loginMsg", "Logging in…", "ok");
  try {
    let email = id;
    if (/^\d{10}$/.test(id)) {
      const m = await getDoc(doc(db, "phoneIndex", id));
      if (!m.exists()) throw { code: "auth/user-not-found" };
      email = m.data().email;
    }
    await signInWithEmailAndPassword(auth, email, pass);
    setMsg("loginMsg", "");
  } catch (e) { setMsg("loginMsg", friendly(e)); }
  $("loginBtn").disabled = false;
};

$("forgotBtn").onclick = async () => {
  const id = $("loginId").value.trim();
  if (!id.includes("@")) return setMsg("loginMsg", "Type your email above, then tap Forgot password.");
  try { await sendPasswordResetEmail(auth, id); setMsg("loginMsg", "Reset link sent to your email.", "ok"); }
  catch (e) { setMsg("loginMsg", friendly(e)); }
};

// ---------- Sign up ----------
$("toSignup").onclick = () => show("signupView");
$("toLogin").onclick = () => show("loginView");
$("signupBtn").onclick = async () => {
  const name = $("suName").value.trim(), mobile = $("suMobile").value.trim(),
        email = $("suEmail").value.trim().toLowerCase(), pass = $("suPass").value;
  if (!name) return setMsg("signupMsg", "Enter your name.");
  if (!/^\d{10}$/.test(mobile)) return setMsg("signupMsg", "Mobile number must be 10 digits.");
  if (!email.includes("@")) return setMsg("signupMsg", "Enter a valid email.");
  $("signupBtn").disabled = true; setMsg("signupMsg", "Creating account…", "ok");
  try {
    const taken = await getDoc(doc(db, "phoneIndex", mobile));
    if (taken.exists()) throw new Error("This mobile number is already registered.");
    const cred = auth.currentUser || (await createUserWithEmailAndPassword(auth, email, pass)).user;
    await setDoc(doc(db, "users", cred.uid), { name, mobile, email, blocked: false, createdAt: serverTimestamp() });
    await setDoc(doc(db, "phoneIndex", mobile), { email, uid: cred.uid });
    location.reload();
  } catch (e) { setMsg("signupMsg", friendly(e)); }
  $("signupBtn").disabled = false;
};

$("logoutBtn").onclick = () => signOut(auth);

// ---------- Punch ----------
async function loadToday() {
  const q = query(collection(db, "punches"),
    where("uid", "==", auth.currentUser.uid), where("date", "==", todayKey()));
  const rows = (await getDocs(q)).docs.map(d => d.data())
    .filter(r => r.time).sort((a, b) => a.time.toMillis() - b.time.toMillis());
  $("log").innerHTML = rows.length
    ? rows.map(r => `<li><span class="tag ${r.type}">${r.type === "IN" ? "Punched in" : "Punched out"}</span><span>${fmtTime(r.time.toDate())}</span></li>`).join("")
    : "<li>No punches yet today.</li>";
  const last = rows.at(-1);
  nextType = last?.type === "IN" ? "OUT" : "IN";
  $("punchBtn").className = "punch " + nextType.toLowerCase();
  $("punchBtn").innerHTML = (nextType === "IN" ? "Punch in" : "Punch out") + "<small>tap to record</small>";
  $("status").textContent = last
    ? (last.type === "IN" ? `You're in since ${fmtTime(last.time.toDate())}` : `You punched out at ${fmtTime(last.time.toDate())}`)
    : "You haven't punched in today.";
}

$("punchBtn").onclick = async () => {
  $("punchBtn").disabled = true; setMsg("punchMsg", "Getting location…", "ok");
  try {
    const fresh = await getDoc(doc(db, "users", auth.currentUser.uid));
    if (fresh.data()?.blocked) return show("blockedView");
    const loc = await getLocation();
    setMsg("punchMsg", "Saving…", "ok");
    await addDoc(collection(db, "punches"), {
      uid: auth.currentUser.uid, name: profile.name, mobile: profile.mobile, email: profile.email,
      type: nextType, date: todayKey(), time: serverTimestamp(),
      lat: loc?.lat ?? null, lng: loc?.lng ?? null, accuracy: loc?.acc ?? null
    });
    setMsg("punchMsg", nextType === "IN" ? "Punched in." : "Punched out.", "ok");
    await loadToday();
  } catch (e) { setMsg("punchMsg", friendly(e)); }
  $("punchBtn").disabled = false;
};

// ---------- Install as app ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e; $("installBar").classList.remove("hidden");
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; $("installBar").classList.add("hidden");
};
</script>
</body>
</html>
